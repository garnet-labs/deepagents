name: Garnet CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/garnet-ci.yml"
      - ".github/scripts/garnet_filesystem_smoke.py"
      - "libs/deepagents/deepagents/backends/filesystem.py"
      - "libs/deepagents/pyproject.toml"
      - "libs/deepagents/uv.lock"

permissions:
  contents: read
  pull-requests: write

jobs:
  filesystem-smoke:
    name: Filesystem Search (Garnet)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: libs/deepagents
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false

      - name: Install project dependencies
        run: uv sync --all-extras --group test

      - name: Garnet Runtime Visibility
        uses: garnet-org/action@3d47f4a9004f7356c980a0e8d420ef5984750e3c # v2
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN }}
          jibril_version: v2.14.0

      - name: Install ripgrep tool
        run: uv tool install --force ripgrep==14.1.0

      - name: Verify filesystem search
        run: PATH="$HOME/.local/bin:$PATH" uv run python ../../.github/scripts/garnet_filesystem_smoke.py
